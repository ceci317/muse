services:
  - type: web
    name: muse-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: DASHSCOPE_API_BASE
        value: https://dashscope.aliyuncs.com/api/v1
      - key: ALLOWED_ORIGINS
        value: https://ceci317.github.io
